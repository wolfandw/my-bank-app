spring.application.name=gateway
server.port=${GATEWAY_PORT:8081}

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.httpclient.connect-timeout=10000
spring.cloud.gateway.httpclient.response-timeout=10s

spring.cloud.gateway.server.webflux.routes[0].id=accounts-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://${ACCOUNT_HOST:localhost}:${ACCOUNT_PORT:8083}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/account
spring.cloud.gateway.server.webflux.routes[0].filters[0]=TokenRelay=

spring.cloud.gateway.server.webflux.routes[1].id=cash-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://${CASH_HOST:localhost}:${CASH_PORT:8084}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/cash
spring.cloud.gateway.server.webflux.routes[1].filters[0]=TokenRelay=

spring.cloud.gateway.server.webflux.routes[2].id=transfer-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://${TRANSFER_HOST:localhost}:${TRANSFER_PORT:8085}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/transfer
spring.cloud.gateway.server.webflux.routes[2].filters[0]=TokenRelay=

spring.cloud.gateway.server.webflux.routes[3].id=accounts-prometheus
spring.cloud.gateway.server.webflux.routes[3].uri=http://${ACCOUNT_HOST:localhost}:${ACCOUNT_PORT:8083}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/accounts/actuator/prometheus
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=cash-prometheus
spring.cloud.gateway.server.webflux.routes[4].uri=http://${CASH_HOST:localhost}:${CASH_PORT:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/cash/actuator/prometheus
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=transfer-prometheus
spring.cloud.gateway.server.webflux.routes[5].uri=http://${TRANSFER_HOST:localhost}:${TRANSFER_PORT:8085}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/transfer/actuator/prometheus
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=notifications-prometheus
spring.cloud.gateway.server.webflux.routes[6].uri=http://${NOTIFICATIONS_HOST:localhost}:${NOTIFICATIONS_PORT:8086}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notifications/actuator/prometheus
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/my-bank-app-realm/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-bank-app-realm}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${spring.application.name}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_GATEWAY_SECRET:27gcWzuNZoOpmR3SygtMFjXr3apPjhVW}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-bank-app-realm}

management.metrics.tags.application=${spring.application.name}
management.endpoints.web.exposure.include=health,info,refresh,metrics,tracing,zipkin,prometheus
management.zipkin.tracing.endpoint=${ZIPKIN_URI:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0
management.metrics.distribution.percentiles-histograms.http.server.requests=true