spring.application.name=front-ui
server.port=${FRONT_UI_PORT:8089}

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${spring.application.name}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_FRONT_UI_SECRET:5eOiAHGLM8KvD2xxMRcCeIogKaFtnN3P}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/my-bank-app-realm}

management.metrics.tags.application=${spring.application.name}
management.endpoints.web.exposure.include=health,info,refresh,metrics,tracing,zipkin,prometheus
management.zipkin.tracing.endpoint=${ZIPKIN_URI:http://localhost:9411/api/v2/spans}
management.tracing.sampling.probability=1.0
management.metrics.distribution.percentiles-histograms.http.server.requests=true