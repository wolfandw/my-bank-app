global:
  scrape_interval: 15s
  scrape_timeout: 12s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'front-ui'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['localhost:8089']

  - job_name: 'gateway'
    metrics_path: '/actuator/prometheus'
    scrape_timeout: 12s
    static_configs:
      - targets: ['my-bank-app:80']

  - job_name: 'accounts'
    metrics_path: '/accounts/actuator/prometheus'
    scrape_timeout: 12s
    static_configs:
      - targets: ['my-bank-app:80']


  - job_name: 'cash'
    metrics_path: '/cash/actuator/prometheus'
    scrape_timeout: 12s
    static_configs:
      - targets: ['my-bank-app:80']

  - job_name: 'transfer'
    metrics_path: '/transfer/actuator/prometheus'
    scrape_timeout: 12s
    static_configs:
      - targets: ['my-bank-app:80']

  - job_name: 'notifications'
    metrics_path: '/notifications/actuator/prometheus'
    scrape_timeout: 12s
    static_configs:
      - targets: ['my-bank-app:80']