accountsdata:
  postgres:
    db: accounts_db
    user: postgres
    password: postgres
  persistence:
    size: 1Gi
    enabled: true

cashdata:
  postgres:
    db: cash_db
    user: postgres
    password: postgres
  persistence:
    size: 1Gi
    enabled: true

notificationsdata:
  postgres:
    db: notifications_db
    user: postgres
    password: postgres
  persistence:
    size: 1Gi
    enabled: true

transferdata:
  postgres:
    db: transfer_db
    user: postgres
    password: postgres
  persistence:
    size: 1Gi
    enabled: true

stringData:
  accountDbUsername: "username"
  accountsDbPassword: "password"

  cashDbUsername: "username"
  cashDbPassword: "password"

  transferDbUsername: "username"
  transferDbPassword: "password"

  notificationsDbUsername: "username"
  notificationsDbPassword: "password"

  keycloakAccountsSecret: "secret"
  keycloakCashSecret: "secret"
  keycloakGatewaySecret: "secret"
  keycloakNotificationsSecret: "secret"
  keycloakTransferSecret: "secret"

kafka:
  fullnameOverride: "kafka"
  podSecurityContext:
    enabled: false
  containerSecurityContext:
    enabled: false

  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: "4.0.0-debian-12-r10"

  kraft:
    enabled: true
    clusterId: "MkU3OEVBNTcwNTJENDM2Qk"

  extraConfig: |
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    default.replication.factor=1
    min.insync.replicas=1

  controller:
    replicaCount: 1

  broker:
    replicaCount: 1
    persistence:
      enabled: true
      size: 2Gi

  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT

  provisioning:
    enabled: false

  sasl:
    enabled: false
  rbac:
    create: false