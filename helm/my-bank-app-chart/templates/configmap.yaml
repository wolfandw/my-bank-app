apiVersion: v1
kind: ConfigMap
metadata:
  name: my-bank-app-config
  namespace: {{ .Release.Namespace | default "dev" }}
data:
  GATEWAY_PORT: "8080"

  ACCOUNT_HOST: "accounts-chart"
  ACCOUNT_PORT: "8080"

  CASH_HOST: "cash-chart"
  CASH_PORT: "8080"

  TRANSFER_HOST: "transfer-chart"
  TRANSFER_PORT: "8080"

  NOTIFICATIONS_HOST: "notifications-chart"
  NOTIFICATIONS_PORT: "8080"

  ACCOUNTS_DB_HOST: "my-bank-app-dev-accountsdata"
  ACCOUNTS_DB_PORT: "5432"
  ACCOUNTS_DB_NAME: "accounts_db"

  CASH_DB_HOST: "my-bank-app-dev-cashdata"
  CASH_DB_PORT: "5432"
  CASH_DB_NAME: "cash_db"

  TRANSFER_DB_HOST: "my-bank-app-dev-transferdata"
  TRANSFER_DB_PORT: "5432"
  TRANSFER_DB_NAME: "transfer_db"
  
  NOTIFICATIONS_DB_HOST: "my-bank-app-dev-notificationsdata"
  NOTIFICATIONS_DB_PORT: "5432"
  NOTIFICATIONS_DB_NAME: "notifications_db"
  
  KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/my-bank-app-realm/protocol/openid-connect/certs"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/my-bank-app-realm"

  KAFKA_URI: "kafka:9092"
  KAFKA_PARTITIONS: "3"
  KAFKA_REPLICAS: "1"
  KAFKA_CLUSTERS_NAME: "my-bank-app-cluster"

  ACCOUNTS_KAFKA_TOPIC: "accounts-to-notifications"
  CASH_KAFKA_TOPIC: "cash-to-notifications"
  TRANSFER_KAFKA_TOPIC: "transfer-to-notifications"
  NOTIFICATIONS_KAFKA_CONSUMER_GROUP-ID: "my-bank-app-consumer-group"

  LOGSTASH_HOST: "host.minikube.internal"

  ZIPKIN_URI: "http://192.168.49.1:9411/api/v2/spans"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  MANAGEMENT_ZIPKIN_TRACING_ENDPOINT: "http://192.168.49.1:9411/api/v2/spans"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: "W3C,B3"
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_ZIPKIN_TRACING_EXPORT_ENABLED: "true"
  MANAGEMENT_ZIPKIN_TRACING_CONNECT-TIMEOUT: "5s"
  MANAGEMENT_ZIPKIN_TRACING_READ-TIMEOUT: "5s"
  JAVA_TOOL_OPTIONS: "-Djava.net.useSystemProxies=false -Djava.net.preferIPv4Stack=true -Dmanagement.zipkin.tracing.endpoint=http://192.168.49.1:9411/api/v2/spans"