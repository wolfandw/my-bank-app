apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace | default "dev" }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag}}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: my-bank-app-config
          env:
            - name: CASH_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: my-bank-app-secrets
                  key: CASH_DB_USERNAME
            - name: CASH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-bank-app-secrets
                  key: CASH_DB_PASSWORD
            - name: KEYCLOAK_CASH_SECRET
              valueFrom:
                secretKeyRef:
                  name: my-bank-app-secrets
                  key: KEYCLOAK_CASH_SECRET