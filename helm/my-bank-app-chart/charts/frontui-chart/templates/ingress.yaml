apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontui-ingress
  namespace: dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: my-bank-app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontui
                port:
                  number: 8080