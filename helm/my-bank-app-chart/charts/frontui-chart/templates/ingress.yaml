apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontui-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
  namespace: dev
spec:
  ingressClassName: nginx
  rules:
    - host: my-bank-app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontui-chart
                port:
                  number: 8080